{% extends "base.html" %}
{% block title %}Dashboard — Gradebook{% endblock %}
{% block content %}
<main>
    <h1>My courses</h1>
    <ul>
        {% for c in courses %}
        <li><a href="{{ url_for('courses.course_detail', course_id=c.id) }}">{{ c.code }} — {{ c.title }} ({{ c.term }})</a></li>
        {% else %}
        <li>You're not enrolled in any courses yet.</li>
        {% endfor %}
    </ul>
</main>
{% endblock %}
