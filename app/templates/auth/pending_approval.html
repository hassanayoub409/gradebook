{% extends "base.html" %}
{% block title %}Pending review — Gradebook{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm text-center">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Request submitted</h1>
                <p>Your request to join as <strong>{{ role }}</strong> is awaiting admin review.</p>
                <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary mt-2">Back to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
