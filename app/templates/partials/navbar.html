<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('main.landing') }}">Gradebook</a>
        <div class="d-flex align-items-center gap-3 ms-auto">
            {% if current_user.is_authenticated %}
                <span class="text-light small">{{ current_user.full_name }} · {{ current_user.role.value }}</span>

                {% if current_user.is_admin %}
                    <a class="btn btn-outline-light btn-sm" href="{{ url_for('admin.requests_list') }}">Requests</a>
                    <a class="btn btn-outline-light btn-sm" href="{{ url_for('admin.users_list') }}">Users</a>
                {% elif current_user.is_approved %}
                    <a class="btn btn-outline-light btn-sm" href="{{ url_for('main.dashboard') }}">Dashboard</a>
                {% endif %}

                <form method="POST" action="{{ url_for('auth.logout') }}" class="mb-0">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
                </form>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.login') }}">Log in</a>
                <a class="btn btn-primary btn-sm" href="{{ url_for('auth.signup') }}">Sign up</a>
            {% endif %}
        </div>
    </div>
</nav>
